    <rect width="1200" height="1200" fill="url(#rdhalo)"/>
    <ellipse cx="600" cy="528" rx="360" ry="336.00000000000006" fill="#d3a85e" opacity="0.1" filter="url(#rdsoft)"/>

    <path d="M 216 983.9999999999999 L 216 492 A 384 384 0 0 1 984 492 L 984 983.9999999999999 Z"
