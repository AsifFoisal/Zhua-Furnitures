        <rect x="526" y="626" width="70" height="5" rx="2.5" fill="#f4ddb7" opacity="0.55"/>
        <rect x="526" y="639" width="112" height="5" rx="2.5" fill="#f4ddb7" opacity="0.35"/>
        <circle cx="664" cy="631" r="13" fill="none" stroke="#dca65c" stroke-width="2"/>
        <path d="M 657 631 L 663 637 L 672 624" fill="none" stroke="#dca65c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="600" y="692" text-anchor="middle" fill="#f2ddbb" font-family="Georgia, serif" font-size="15" letter-spacing="4">SCENTARIVA</text>
        <text x="600" y="709" text-anchor="middle" fill="#bca57c" font-family="Georgia, serif" font-size="7.5" letter-spacing="2.9">SMART SCENT SYSTEM</text>
      </g>
      <g opacity="0.8">
        <rect x="574" y="761" width="52" height="4" rx="2" fill="#f1d7a6" opacity="0.5"/>
        <circle cx="600" cy="801" r="8" fill="none" stroke="#f1d7a6" stroke-width="1.3" opacity="0.7"/>
