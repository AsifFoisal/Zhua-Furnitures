      </g>
      <rect x="544" y="662" width="112" height="56" rx="8" fill="url(#rdgold)"/>
      <rect x="551" y="669" width="98" height="42" rx="5" fill="#19130c"/>
      <path d="M 503 708 Q 503 690 533 690 L 667 690 Q 697 690 697 708 L 688 986 Q 683 996 600 996 Q 517 996 512 986 Z"
