<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="ZHUA Absolut Gold 150 ml reed diffuser with natural reeds">
    <defs>

    <filter id="rdsoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="rdshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="rdblur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="rdblur2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="rdgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <radialGradient id="rdhalo" cx="50%" cy="42%" r="58%">
      <stop offset="0" stop-color="#d3a35f" stop-opacity="0.25"/>
      <stop offset="0.46" stop-color="#b67c3b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rdvignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </linearGradient>

      <linearGradient id="rdbg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2c2416"/>
        <stop offset="0.55" stop-color="#2c2416"/>
        <stop offset="1" stop-color="#0c0a09"/>
      </linearGradient>
      <linearGradient id="rdmachineBody" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#050505"/>
        <stop offset="0.18" stop-color="#161412"/>
        <stop offset="0.55" stop-color="#24201c"/>
        <stop offset="0.82" stop-color="#0a0908"/>
        <stop offset="1" stop-color="#020202"/>
      </linearGradient>
      <linearGradient id="rdgold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8f6c2d"/>
        <stop offset="0.28" stop-color="#e1bd78"/>
        <stop offset="0.56" stop-color="#b78c44"/>
        <stop offset="0.8" stop-color="#f6ddb0"/>
        <stop offset="1" stop-color="#8d682c"/>
      </linearGradient>
      <linearGradient id="rdcap" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#050505"/>
        <stop offset="0.35" stop-color="#2c2823"/>
        <stop offset="0.62" stop-color="#151310"/>
        <stop offset="1" stop-color="#030303"/>
      </linearGradient>
      <linearGradient id="rdbottleGlass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#2a1209"/>
        <stop offset="0.18" stop-color="#5a2f17"/>
        <stop offset="0.48" stop-color="#8c5128"/>
        <stop offset="0.72" stop-color="#5a2f17"/>
        <stop offset="1" stop-color="#2a1209"/>
      </linearGradient>
      <linearGradient id="rdreedGlass" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5d4120"/>
        <stop offset="0.25" stop-color="#b08345"/>
        <stop offset="0.52" stop-color="#d9b577"/>
        <stop offset="0.76" stop-color="#8b622e"/>
        <stop offset="1" stop-color="#4e351a"/>
      </linearGradient>
      <linearGradient id="rdfade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity=".65"/>
      </linearGradient>
