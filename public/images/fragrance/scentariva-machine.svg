        fill="none" stroke="#c98b44" stroke-opacity="0.36" stroke-width="8.4" stroke-linecap="round"/>
      <path d="M 615.75 331.6 C 668.25 272.8, 576.9 233.95, 640.95 164.65 C 680.85 123.69999999999999, 606.3 67, 623.1 10.300000000000011"
