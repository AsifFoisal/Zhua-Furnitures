      <path d="M 520 728 C 503 800, 512 909, 526 970"
        fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
      <path d="M 669 756 C 695 838, 685 908, 672 958"
        fill="none" stroke="#d6a85d" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round"/>
      <rect x="506" y="808" width="188" height="126" rx="3" fill="#f5edd9"/>
      <rect x="515" y="817" width="170" height="108" rx="1.5" fill="none" stroke="#322416" stroke-opacity="0.26"/>
      <text x="600" y="840" text-anchor="middle" fill="#2e2217" font-family="Georgia, serif" font-size="8" letter-spacing="3">ZHUA</text>
      <text x="600" y="869" text-anchor="middle" fill="#2e2217" font-family="Georgia, serif" font-size="19" letter-spacing="1.4">Absolut Gold</text>
      <text x="600" y="888" text-anchor="middle" fill="#8e6a2f" font-family="Georgia, serif" font-size="7" letter-spacing="2.2">REED DIFFUSER</text>
      <line x1="564" y1="898" x2="636" y2="898" stroke="#b98d42" stroke-width="1.2"/>
      <text x="600" y="915" text-anchor="middle" fill="#5f4a2b" font-family="Georgia, serif" font-size="7" letter-spacing="1.7">150 ML</text>
      <rect x="495" y="962" width="210" height="24" rx="10" fill="#fff" opacity="0.04"/>
    </g>
    <text x="600" y="1112" text-anchor="middle" fill="#f3e7cf" font-family="Georgia, serif" font-size="15" letter-spacing="6">ABSOLUT GOLD</text>
    <text x="600" y="1139" text-anchor="middle" fill="#c9ae7d" fill-opacity=".78" font-family="Georgia, serif" font-size="9.5" letter-spacing="4">150 ML REED DIFFUSER</text>
    <rect width="1200" height="1200" fill="url(#rdvignette)"/>
    <rect width="1200" height="1200" filter="url(#rdgrain)" opacity="0.24"/>
