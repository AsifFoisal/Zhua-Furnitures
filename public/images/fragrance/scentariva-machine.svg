      <path d="M 508 992 L 692 992 L 706 1012 L 494 1012 Z" fill="#0a0a0a"/>
      <rect x="474" y="415" width="252" height="585" rx="34" fill="url(#mmachineBody)"/>
      <rect x="476" y="418" width="248" height="579" rx="32" fill="none" stroke="#f3d7a4" stroke-opacity="0.13"/>
