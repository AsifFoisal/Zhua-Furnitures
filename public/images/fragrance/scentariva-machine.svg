      <rect x="514" y="397" width="172" height="35" rx="17" fill="url(#mgold)"/>
      <rect x="524" y="403" width="152" height="23" rx="11" fill="#1b1610"/>
      <rect x="491" y="450" width="218" height="34" rx="17" fill="#080808"/>
      <rect x="491" y="450" width="218" height="34" rx="17" fill="none" stroke="#f1c57f" stroke-opacity="0.22"/>
      <g>
        <rect x="490" y="575" width="220" height="146" rx="20" fill="#050505" stroke="#f1c57f" stroke-opacity="0.15"/>
